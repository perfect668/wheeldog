[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wheeldog-recoverability"
version = "0.1.0"
description = "EXP0: finite-horizon recoverability of a toy LIPM and constrained actuator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "scipy>=1.8", "matplotlib>=3.5", "PyYAML>=5.4"]

[project.optional-dependencies]
test = ["pytest>=6.2"]
m1 = ["mujoco>=3.10", "trimesh>=4.12", "python-fcl>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
